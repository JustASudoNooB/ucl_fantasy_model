[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucl-fantasy-engine"
version = "0.13.0"
description = "Predictions, simulation and decision support for UEFA Champions League Fantasy"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyyaml>=6",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
  "feedparser>=6.0",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ufe = "ufe.cli:main"

[tool.setuptools.packages.find]
include = ["ufe*"]

[tool.setuptools.package-data]
"ufe.report" = ["*.html"]
