# Daily data refresh that is saved back to the repo, so laptop runs and every later workflow
# start from the same fresh inputs: current-season domestic results (football-data.co.uk merged
# into the openfootball files), Premier League form (FPL API) and the official game feed.
# Commits only when a file actually changed.
name: data-sync
on:
  schedule:
    - cron: "40 4 * * *"         # 10:10 IST daily
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: data-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Sync results, form and game feed
        run: |
          python -m ufe sync --results --form --feed 2>&1 | tee sync.txt
          sed 's/^/::notice::sync: /' sync.txt | cut -c1-900
      - name: Commit changed data
        run: |
          git config user.name "ucl-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/openfootball/*.json data/processed/domestic_form.csv data/processed/players_feed.csv data/processed/feed_meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::no data changes"
          else
            git commit -m "data: results, form and feed $(date -u +%F)"
            git pull --rebase -q && git push
            echo "::notice::data committed: $(git diff --stat HEAD~1 | tail -1)"
          fi
