# Daily data refresh that is saved back to the repo, so laptop runs and every later workflow
# start from the same fresh inputs: current-season domestic results (football-data.co.uk merged
# into the openfootball files), Premier League form (FPL API), the official game feed (and its
# pre-deadline copy for live points) and this season's league penalty takers (starting11.com).
# Commits only when a file actually changed.
name: data-sync
on:
  schedule:
    - cron: "40 4 * * *"         # 10:10 IST daily
  workflow_dispatch:
    inputs:
      odds_md: { description: "Backfill bookmaker odds for this matchday (optional)", required: false, default: "" }
      odds_urls: { description: "Comma-separated rg.org article URLs for that matchday", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: data-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Sync results, form and game feed
        env:
          UFE_API_FOOTBALL_KEY: ${{ secrets.UFE_API_FOOTBALL_KEY }}     # optional: league form outside the Premier League
        run: |
          python -m ufe sync --results --form --feed --penalties --apifootball 2>&1 | tee sync.txt
          sed 's/^/::notice::sync: /' sync.txt | cut -c1-900
      - name: Confirmed line-ups of the last matchday played (start-probability history)
        env:
          UFE_API_FOOTBALL_KEY: ${{ secrets.UFE_API_FOOTBALL_KEY }}
        run: |
          if [ -z "$UFE_API_FOOTBALL_KEY" ]; then echo "::notice::line-ups: no UFE_API_FOOTBALL_KEY secret"; exit 0; fi
          MD=$(python -c "from ufe.cli import _live_md; print(_live_md() - 1)")
          if [ "$MD" -ge 1 ] && [ ! -f "data/processed/lineups_md$MD.csv" ] && [ ! -f "data/seed/lineups/md${MD}_actual_xis.txt" ]; then
            python -m ufe sync --lineups "$MD" 2>&1 | tail -3 | sed 's/^/::notice::line-ups: /' || true
          fi
        continue-on-error: true
      - name: Backfill bookmaker odds for a past matchday (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.odds_md != '' && inputs.odds_urls != '' }}
        run: |
          python -m ufe sync --freeodds "${{ inputs.odds_md }}" --odds-urls "${{ inputs.odds_urls }}" 2>&1 | tail -3 | sed 's/^/::notice::odds backfill: /'
        continue-on-error: true
      - name: Commit changed data
        run: |
          git config user.name "ucl-data-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/raw/openfootball/*.json data/processed/domestic_form.csv data/processed/players_feed.csv \
                   data/processed/feed_meta.json data/processed/feed_pre_md*.csv data/processed/lineups_md*.csv data/processed/api_football_teams.json \
                   data/processed/penalty_takers.csv data/processed/odds_md*.csv; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "::notice::no data changes"
          else
            git commit -m "data: results, form and feed $(date -u +%F)"
            git pull --rebase -q && git push
            echo "::notice::data committed: $(git diff --stat HEAD~1 | tail -1)"
          fi
