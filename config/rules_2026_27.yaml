# UEFA Champions League Fantasy 2026/27 — machine-readable rules.
# Source: Fantasy Football Scout rules guide (published 31 Aug 2026, updated 10 Sep 2026),
# cross-checked against UEFA.com chip articles. Re-verify against the official rules page
# at the start of every phase; anything under `unknowns` must be confirmed before relying on it.
season: "2026/27"
verified:
  checked_at: "2026-10-13"
  sources:
    - https://www.fantasyfootballscout.co.uk/2026/08/31/how-to-play-uefa-champions-league-fantasy-2026-27-rules-scoring-chips
    - https://www.uefa.com/uefachampionsleague/news/02a2-1fe84ad2ccea-e0022a7c2fdd-1000--what-are-the-champions-league-fantasy-football-rules-for-mat

squad:
  size: 15
  positions: {GK: 2, DEF: 5, MID: 5, FWD: 3}
  budget:
    league_phase: 100.0
    knockout: 105.0          # budget rises after the league phase

lineup:
  size: 11
  min: {GK: 1, DEF: 3, MID: 2, FWD: 1}
  max: {GK: 1, DEF: 5, MID: 5, FWD: 3}

club_cap:                    # max players from one club, by stage
  league: 3
  ko_playoff: 4
  r16: 4
  qf: 5
  sf: 6
  final: 8

captain:
  multiplier: 2
  switch_after_day: true     # can move armband to a player yet to play once a day's games finish
  switch_irreversible: true
  can_switch_to_played: false

manual_subs:
  max_per_md: 4
  only_after_day_complete: true
  sent_off_cannot_be_subbed: true
  unavailable_mds: [8, 17]   # all fixtures kick off together

auto_subs:
  enabled: true
  disabled_by_any_manual_change: true   # manual sub, captain change or bench reorder

transfers:
  hit_cost: 4                # deducted from overall total, not the matchday score
  # free transfers before each matchday; "unlimited" = free reset; carry = max unused carried
  by_md:
    1:  {free: unlimited}
    2:  {free: 2, carry: 1}
    3:  {free: 2, carry: 1}
    4:  {free: 2, carry: 1}
    5:  {free: 2, carry: 1}
    6:  {free: 2, carry: 1}
    7:  {free: 2, carry: 1}
    8:  {free: 2, carry: 1}
    9:  {free: unlimited}
    10: {free: 2, carry: 0}
    11: {free: unlimited}
    12: {free: 3, carry: 0}
    13: {free: 5, carry: 0}
    14: {free: 3, carry: 0}
    15: {free: 5, carry: 0}
    16: {free: 3, carry: 0}
    17: {free: 5, carry: 0}

chips:
  wildcard:  {count: 1, blocked_mds: [1, 9, 11], permanent: true,  budget_limited: true}
  limitless: {count: 1, blocked_mds: [1, 9, 11], permanent: false, budget_limited: false}
  activation_cancels_prior_transfers: true

scoring:
  appearance: 1
  sixty_minutes: 1
  goal: {GK: 6, DEF: 6, MID: 5, FWD: 4}
  goal_outside_box_bonus: 1
  assist: 3
  clean_sheet: {GK: 4, DEF: 4, MID: 1, FWD: 0}
  clean_sheet_min_minutes: 60          # excluding added time
  goals_conceded_step: 2               # -1 per 2 conceded (GK, DEF)
  goals_conceded_penalty: {GK: -1, DEF: -1, MID: 0, FWD: 0}
  saves_step: 3                        # +1 per 3 saves (GK)
  penalty_save: 5
  recoveries_step: 3                   # +1 per 3 balls recovered (all positions)
  player_of_the_match: 3
  penalty_won: 2                       # not awarded for handball penalties
  penalty_conceded: -1
  penalty_missed: -2
  yellow_card: -1
  red_card: -3
  own_goal: -2

matchdays:
  # deadline = first kick-off of the matchday (CET/CEST local time)
  - {md: 1,  stage: league,     first_kickoff: "2026-09-08 18:45", days: 3}
  - {md: 2,  stage: league,     first_kickoff: "2026-10-13 18:45", days: 2}
  - {md: 3,  stage: league,     first_kickoff: "2026-10-20 18:45", days: 2}
  - {md: 4,  stage: league,     first_kickoff: "2026-11-03 18:45", days: 2}
  - {md: 5,  stage: league,     first_kickoff: "2026-11-24 18:45", days: 2}
  - {md: 6,  stage: league,     first_kickoff: "2026-12-08 18:45", days: 2}
  - {md: 7,  stage: league,     first_kickoff: "2027-01-19 18:45", days: 2}
  - {md: 8,  stage: league,     first_kickoff: "2027-01-27 21:00", days: 1}
  - {md: 9,  stage: ko_playoff, first_kickoff: "2027-02-16 18:45", days: 2}
  - {md: 10, stage: ko_playoff, first_kickoff: "2027-02-23 18:45", days: 2}
  - {md: 11, stage: r16,        first_kickoff: "2027-03-09 18:45", days: 2}
  - {md: 12, stage: r16,        first_kickoff: "2027-03-16 18:45", days: 2}
  - {md: 13, stage: qf,         first_kickoff: "2027-04-06 21:00", days: 2}
  - {md: 14, stage: qf,         first_kickoff: "2027-04-13 21:00", days: 2}
  - {md: 15, stage: sf,         first_kickoff: "2027-04-27 21:00", days: 2}
  - {md: 16, stage: sf,         first_kickoff: "2027-05-04 21:00", days: 2}
  - {md: 17, stage: final,      first_kickoff: "2027-06-05 21:00", days: 1}

league_phase:
  teams: 36
  matches_per_team: 8
  direct_r16: [1, 8]          # top 8 skip the play-offs (their players blank MD9-MD10)
  playoff: [9, 24]
  eliminated: [25, 36]

unknowns:   # confirm on the official rules page; engine defaults in brackets
  - "Player price changes during the season and selling-price rules [prices static, sell = buy]"
  - "Vice-captain existence [none: a non-playing captain scores 0 unless switched]"
  - "Exact ball-recovery and assist definitions used by the data provider [Opta-like]"
  - "How Player of the Match is chosen [UEFA technical observers; modelled by performance score]"
  - "Extra-time and shoot-out scoring in knockout ties [extra time counts, shoot-outs do not]"
  - "Whether the substitution window closes per kick-off or at the next day's first kick-off [per kick-off]"
  - "Whether a player brought on by manual sub can receive a switched captaincy [yes]"
  - "Tie-breakers in mini-leagues"
  - "Exact kick-off slots for MD9-MD17 [18:45 / 21:00 CET]"
