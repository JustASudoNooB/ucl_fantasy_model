# Engine settings. Every hyperparameter here is tuned by `ufe tune` (walk-forward backtest)
# and the tuned values are written to data/processed/params.json, which overrides these defaults.
paths:
  raw: data/raw
  processed: data/processed
  runs: data/runs
  seed: data/seed

timezone_user: Asia/Kolkata
timezone_uefa: Europe/Paris

team_model:
  half_life_days: 300          # time-decay of match weights
  european_weight: 1.6         # UEFA matches are the only cross-league links; weight them up
  current_ucl_weight: 2.0      # this season's UCL matches
  prior_sd_team: 0.35          # team attack/defence shrinkage toward league mean (log scale)
  prior_sd_league: 0.45        # league mean shrinkage toward 0
  dc_rho: -0.06                # Dixon-Coles low-score correction (refit by tune)
  max_goals: 10
  history_seasons: ["2024-25", "2025-26", "2026-27"]
  rating_noise_sd: 0.06        # per-simulation rating uncertainty (log scale) for tournament sims
  predictive_sd_scale: 1.0     # match probabilities integrate over rating uncertainty (0 = point estimate)
  # recent form: 30% of each match's weight decays with a 90-day half-life (on top of the long one).
  # Walk-forward (scripts/backtest_form_homeaway.py): UCL RPS 0.19580 -> 0.19566, domestic 0.20138 -> 0.20129;
  # better on all four scores (UCL/domestic x RPS/log loss), so adopted. Small, as expected.
  form_mix: 0.3
  form_half_life: 90
  # club-specific home/away effects: tested at prior sd 0.05/0.1/0.2, worse on UCL matches -> off.
  # Home advantage stays per league (and one for UEFA games); records are shown on the dashboard.
  home_sd_team: 0.0
  # goal-level shifts (log scale, N(0, sd^2) priors): every match of this season, and this season's
  # UEFA matches on top. The 500-day half-life moved the scoring rate too slowly: 2026/27 UCL has
  # 4.09 goals a game after MD3 (3.44 last season) and the model under-forecast every matchday.
  # Walk-forward (scripts/backtest_goal_level.py, 26 Oct): UCL 2026/27 log loss 0.8418 -> 0.8351,
  # total-goals log score 2.140 -> 2.085, goal bias -0.69 -> -0.31 a match; domestic 2026/27 log loss
  # 0.9541 -> 0.9517; UCL 2024-26 and domestic 2025/26 unchanged within 0.0004.
  season_level_sd: 0.2
  cup_level_sd: 0.0
  cup_season_level_sd: 0.2

market:
  blend_weight: 0.65           # weight on market-implied goal rates when odds exist
  margin_method: power         # power | shin | proportional

simulation:
  n_sims: 12000
  seed: 20261013
  goal_time_slope: 0.35        # goal-time density rises through the match: f(t) ~ 1 + slope * t/90
  assist_rate: 0.86            # share of open-play goals credited with an assist
  own_goal_share: 0.038        # PL 2025/26: 0.053 own goals per team-match
  penalties_per_team_match: 0.11
  penalty_conversion: 0.78
  penalty_won_by_foul_share: 0.82   # handball pens give no "penalty won" points
  saves_per_xgc: 2.0           # keeper saves per opponent expected goal (PL 2025/26)
  red_card_per90: 0.0045
  outside_box_share: {GK: 0.0, DEF: 0.10, MID: 0.20, FWD: 0.08}   # priors; refit from feed stats
  # UEFA ball recoveries per Opta-scale recovery, by position. Refit on the game feed's totals for
  # MD1-4 (10 Nov; python -m ufe calibrate): the old values (0.35 / 1.5 / 1.3 / 1.1) had midfielders at
  # 5.9 recoveries per 90 against 3.5 real, forwards 2.4 against 1.4, and keepers 2.9 against none.
  recovery_ratio: {GK: 0.0, DEF: 1.40, MID: 0.78, FWD: 0.64}
  # The game's assists by position, relative to the model's shares (within-club split, MD1-4:
  # forwards 49 against 27 expected, midfielders 132 against 150, defenders 52 against 55). The game
  # also credits rebounds and penalties won, which forwards collect. Shrunk toward 1.
  assist_pos_mult: {GK: 1.0, DEF: 0.92, MID: 0.92, FWD: 1.6}
  others_floor: 0.08           # minimum unallocated goal share when the player pool is partial

potm:
  w_goal: 3.0
  w_assist: 1.8
  w_cs_def: 1.2
  w_save3: 0.6
  w_recov3: 0.35
  w_win: 1.6
  w_draw: 0.5
  noise_scale: 1.1             # Gumbel scale; higher = less predictable POTM

minutes:
  sub_on_minute: [58, 86]
  p_full_90_given_start: {GK: 0.96, DEF: 0.80, MID: 0.56, FWD: 0.45}
  off_minute_range: [58, 89]
  p_sub_given_benched: {GK: 0.01, DEF: 0.18, MID: 0.34, FWD: 0.38}

optimizer:
  bench_weight: 0.12           # value of bench EV in the squad objective (auto/manual subs)
  horizon: 4                   # matchdays in transfer planning
  horizon_decay: 0.82          # weight of MD h+1 relative to MD h
  hit_margin: 1.0              # extra EV a -4 must clear (model error buffer)
  candidates: 25               # top MILP candidates evaluated by policy simulation

alerts:
  telegram_token_env: UFE_TELEGRAM_TOKEN
  telegram_chat_env: UFE_TELEGRAM_CHAT
  deadline_warnings_hours: [48, 24, 6, 2]

xi_history:
  # earlier UCL starting XIs (data/seed/lineups/md{N}_actual_xis.txt) update start probabilities
  # before any team news: Beta update, prior weight kappa, latest XI weight 1, the one before decay.
  # Checked with the engine on MD2 and MD3 (update before news, scratch test 26 Oct): start log loss
  # MD2 0.388 -> 0.358, MD3 0.483 -> 0.422; actual starters among each club's top 11: 311 -> 317 and
  # 262 -> 289. kappa 1.0 was best on both matchdays, 1.5 close, 2.5+ clearly worse.
  enabled: true
  kappa: 1.0
  decay: 0.7
  # keepers rotate least: their previous XIs count four times as much (scripts/tune_xi_history.py,
  # 2 Nov, MD2+MD3: keeper start log loss 0.197 -> 0.179 at kappa_gk 0.25; outfield unchanged)
  kappa_gk: 0.25

news:
  # Predicted line-ups update start probabilities by Bayes' rule (ufe/ingest/team_news.py).
  # lr_start = P(named | starts) / P(named | doesn't start); lr_bench = P(not named | starts) / P(not named | doesn't start).
  # Calibrated 2026-10-14 with team_news.lr_from_counts on MD2 Tuesday: UEFA's predicted XIs named
  # 49 of the 66 actual starters of ARS, LIL, BAY, BAR, MUN, ATM (74%) and 17 of ~90 non-starters,
  # shrunk toward the old 93% / 10% assumption with 100 pseudo-observations each:
  # sensitivity 0.855, false-positive rate 0.142 -> 6.0 and 0.17 (was 9.3 and 0.078).
  lr_start: 6.0
  lr_bench: 0.17
  doubt_in: 0.62      # cap for a doubtful player still named in the predicted XI
  doubt_out: 0.15     # cap for a doubtful player left out
  p_max: 0.95         # even a named, fit regular misses ~5% of starts (late knocks, rotation); was 0.985
  carry_forward: 0.5  # matchdays without news reuse the latest earlier news at this fraction of log-odds
  # A weaker file's absences that UEFA's game feed does not show (team_news.absence_mult). MD4, a
  # third-party file at strength 0.7: 45 listed out but unflagged by UEFA, 7 started; 6 listed
  # suspended, 4 started; the 69 the feed also flagged: 0 started. Start log loss on MD4
  # 0.443 -> 0.370 (0.371 with the two numbers chosen on the other clubs); flat from 0.3 to 0.6.
  out_unconfirmed: 0.4
  susp_unconfirmed: 0.85
  # Start-probability model when news exists (scripts/calibrate_lineups.py, MD2 Tuesday, 144 players):
  #   logit P(start) = a + b * logit(prior) + c * named
  # Leave-one-club-out log loss: 0.567 with b fixed at 0.5 (0.553 with b free = 0.26) vs 0.678 for
  # the Bayes-rule version above, which was overconfident both ways (named regulars -> 0.95,
  # unnamed regulars -> 0.37; real rates ~0.80 and ~0.45). b is held at 0.5 until more line-ups
  # are logged; re-run the script after each matchday.
  model: logistic
  logit_a: -0.94
  logit_b: 0.5
  logit_c: 1.86
  strength_adjust: 0.5    # share of the missing attacking weight that replacements do not recover
  strength_clip: [0.88, 1.06]

player_form:
  # this season's domestic-league minutes, starts, goals, assists and xG per player
  # (data/seed/form/domestic_2026_27.csv; data/processed/domestic_form.csv from `ufe sync --form`).
  # Weights in ufe/models/history.py, from scripts/backtest_player_form.py.
  enabled: true

ml:
  # learned models (ufe/ml/). `weights`: their share of the player predictions in the combined model
  # (compare/registry.py); the statistical model keeps the rest. Equal thirds: with four matchdays
  # graded, fitted weights would be noise.
  blend: 0.0
  weights: {network: 0.3333, trees: 0.3333}

availability:
  # multipliers on start and substitute chances from UEFA's flags in the game feed (pipeline.availability)
  injured: 0.03            # MD4: 0 of 85 started, 1 came off the bench
  suspended: 0.0
  not_in_squad: 0.0        # MD4: 1 of 121 started
  doubtful: 0.65           # MD4: 8 of 25 started
  unlikely: 0.4            # "Unlikely to start next game" with no status: no matchday to check it on yet
  fade: 0.5                # per matchday further ahead, the effect of an injury or doubt halves

start:
  # players_for: club totals forced to eleven starters, outfield players capped (pipeline._normalise_starts)
  normalise: true
  team_total: 10.8
  cap: 0.85
  cap_gk: 0.97

ucl_obs:
  # this season's UCL numbers per player from the game feed, blended into the rates
  # (player_rates.apply_ucl_observations)
  enabled: true
  # Kept slow on purpose: over MD1-4 a starter's over- or under-performance against the model did not
  # carry over to his next match (958 player-matches, correlation +0.01), so four matches move a share little.
  k_goals: 10.0            # pseudo-goals of prior weight; + k_history_extra x the weight of the player's league history
  k_assists: 10.0
  k_history_extra: 8.0
  mult_range: [0.7, 1.5]
  rec_k: {GK: 4.0, DEF: 12.0, MID: 3.0, FWD: 6.0}     # matches of prior weight for the player's own recovery rate

engine:
  # which model feeds the picks (python -m ufe plan / dashboard / livecall): statistical | combined
  # combined since 11 Nov: on MD1-4 rebuilt with pre-deadline inputs its start log loss beat the
  # statistical model's on every matchday (paired difference 0.007, 95% interval 0.001 to 0.013,
  # clubs resampled), points error level or slightly better, top picks by position 752 v 725 points.
  model: combined
